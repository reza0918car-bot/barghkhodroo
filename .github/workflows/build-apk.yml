name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android & Apply All Fixes
        run: |
          echo "1. Creating Android directory..."
          flutter create . --platforms=android
          
          echo "2. Fixing Namespace issue for ALL plugins..."
          cat <<EOF >> android/build.gradle
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          if (namespace == null) {
                              namespace project.group
                          }
                      }
                  }
              }
          }
          EOF

          echo "3. Patching android_file_picker's build.gradle.kts (Inverted Condition Fix)..."
          # پیدا کردن فایل build.gradle.kts پلاگین مشکل‌دار
          PLUGIN_GRADLE_KTS=$(find ~/.pub-cache -path "*/android_file_picker-*/android/build.gradle.kts" | head -n 1)
          
          if [ -n "$PLUGIN_GRADLE_KTS" ]; then
            echo "Found plugin gradle file at: $PLUGIN_GRADLE_KTS"
            # ۱. نمایش خطوطی که شرط در آن‌ها وجود دارد (برای دیباگ)
            grep -n "isAgp9OrAbove" "$PLUGIN_GRADLE_KTS" || echo "No isAgp9OrAbove found."
            
            # ۲. اصلاح شرط برعکس در فایل Kotlin DSL
            # الگوی قبلی: if (!isAgp9OrAbove) { ... }
            # الگوی جدید: if (isAgp9OrAbove) { ... }
            sed -i 's/if (!isAgp9OrAbove)/if (isAgp9OrAbove)/g' "$PLUGIN_GRADLE_KTS"
            
            echo "Patch applied. Verifying..."
            grep -n "isAgp9OrAbove" "$PLUGIN_GRADLE_KTS"
          else
            echo "ERROR: build.gradle.kts for android_file_picker not found!"
            # اگر فایل پیدا نشد، بیلد را متوقف کن تا مشکل پنهان نماند
            exit 1 
          fi

          echo "4. Disabling Lint..."
          if [ -f android/app/build.gradle.kts ]; then
            sed -i '/android {/a \    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }' android/app/build.gradle.kts
          else
            sed -i '/android {/a \    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }' android/app/build.gradle
          fi

          echo "5. Setting App Name and Permissions..."
          sed -i 's/android:label="[^"]*"/android:label="برق خودرو مهندس"/g' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.SEND_SMS"\/>' android/app/src/main/AndroidManifest.xml

          echo "6. Setting minSdkVersion to 23..."
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts
          else
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle
          fi

      - name: Get Dependencies and Generate Icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bargh-khodro-mohandes-apk
          path: build/app/outputs/flutter-apk/app-release.apk
